<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0
        <title>React - Componentes</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module">
            import React from 'https://esm.sh/react?dev'
            import ReactDOM from 'https://esm.sh/react-dom/client?dev'
            window.React = React
            window.ReactDOM = ReactDOM
        </script>

        <script src ="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <script type="text/babel">
            /*Componente para saludar sin props
            function Saludar() {
                return <h1>Hola!!!</h1>
            }
            */
           /*Con props
           function Saludar(props) {
                return <h1>Hola {props.nombre}!!!</h1>
            }
            */
            //Con destructuring
            function Saludar({ nombre, edad, ciudad }) {
                return (
                    <div>
                        <h1>¡Hola, {nombre}!</h1>
                        <p>
                            Tienes {edad} años y vives en {ciudad}
                        </p>
                    </div>
                )
            }

            //Rebderizamos el componente
            window.onload = () => {
                const rootEl = document.querySelector('#root')
                const root = ReactDOM.createRoot(rootEl)
                root.render(<Saludar nombre="Inesita" edad={25} ciudad="Lyon" />)
                //Los valores no strings se ponen entre llaves {} y no comillas
                root.render(<Saludar2 nombre="Inesita" color="blue" />)
            }

            //Probamos introduciendo estiilos
            function Saludar2({ nombre, color }) {
                return (
                    <h1 style={{ color: color, fontSize: '32px', textAlign: 'center' }}>
                            ¡Hola, {nombre}!
                    </h1>
                )
            }

            //Los estilos son un objeto JavaScript
            //Las propiedades usan camelCase: fontSize en lugar de font-size
            //Los valores son strings: '32px' o números: 32
            //Se pasan con llaves: style={estilos} o style={{ color: 'red' }}
            //Cuando la propiedad del objeto tiene el mismo nombre que la variable (color: color), puedes escribir solo color
            window.onload = () => {
                const rootEl = document.querySelector('#root')
                const root = ReactDOM.createRoot(rootEl)
                root.render(
                    <div>
                        <Saludar2 nombre="Miguel" color="blue" />
                        <Saludar2 nombre="Ana" color="green" />
                        <Saludar2 nombre="Inesita" color="orange" />
                    </div>
                )
            }

            //<!-- HTML normal -->
            //<h1 style="color: red; font-size: 32px">Hola</h1>
            
            //JSX (JavaScript)
            //<h1 style={{ color: 'red', fontSize: '32px' }}>Hola</h1>
            
        </script>
    </body>
</html>
