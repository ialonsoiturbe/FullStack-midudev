<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>React</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <<body>    <!-- Aquí React renderizará nuestra aplicación -->    
        <div id="root"></div>    <!-- Cargar React y ReactDOM desde CDN -->    
        <script type="module">      
            import React from 'https://esm.sh/react?dev'      
            import ReactDOM from 'https://esm.sh/react-dom/client?dev'  //El ?dev al final activa el modo desarrollo para mejores mensajes de error

            // Crear un elemento h1 con React.createElement      
            const titulo = React.createElement(       
                'h1', // Tipo de elemento (h1, div, p, etc.)
                { style: { color: '#09f' } }, // Props (atributos) ¿Qué propiedades? (className, style, etc.)
                '¡Hola React!' // Contenido (children)      
            )
            /*
            El ejemplo en html sería:
            <h1 style="color: #09f">¡Hola React!</h1>
            */

            // Renderizar en el DOM
            const rootEl = document.querySelector('#root')
            const root = ReactDOMClient.createRoot(rootEl)
            root.render(titulo)    

            // Crear una tarjeta de empleo sin JSX
            const tarjetaEmpleo = React.createElement(
                'article',  { className: 'job-listing-card' },
                 React.createElement('h3', null, 'Desarrollador Frontend'),
                 React.createElement('small', null, 'TechCorp | Madrid'),
                 React.createElement('p', null, 'Buscamos desarrollador con experiencia en React'),
                 React.createElement('button', { className: 'button-apply-job' }, 'Aplicar')
            )
            // Renderizar la tarjeta
            root.render(tarjetaEmpleo)
            /*
            El ejemplo en html sería:
            <div class="container">  
                <h1>Título</h1>  
                <p>Párrafo</p>  
                <button>Botón</button>
            </div>
            */

        </script>  
    </body>

</html>
