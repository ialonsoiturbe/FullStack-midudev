<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>React</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body>    <!-- Aquí React renderizará nuestra aplicación -->    
        <div id="root"></div>
        
        <!-- Cargar React y ReactDOM desde CDN -->    
        <script type="module">      
            import React from 'https://esm.sh/react?dev'      
            import ReactDOM from 'https://esm.sh/react-dom/client?dev'  //El ?dev al final activa el modo desarrollo para mejores mensajes de error
            window.React = React
            window.ReactDOMClient = ReactDOM
        </script>

            <!-- 
            /*Crear un elemento h1 con React.createElement      
            const titulo = React.createElement(       
                'h1', // Tipo de elemento (h1, div, p, etc.)
                { style: { color: '#09f' } }, // Props (atributos) ¿Qué propiedades? (className, style, etc.)
                '¡Hola React!' // Contenido (children)      
            )
            */

            /*
            El ejemplo en html sería:
            <h1 style="color: #09f">¡Hola React!</h1>
            */

            /* Renderizar en el DOM
            const rootEl = document.querySelector('#root')
            const root = ReactDOMClient.createRoot(rootEl)
            root.render(titulo)    
            */

            /* Crear una tarjeta de empleo sin JSX
            const tarjetaEmpleo = React.createElement(
                'article',  { className: 'job-listing-card' },
                 React.createElement('h3', null, 'Desarrollador Frontend'),
                 React.createElement('small', null, 'TechCorp | Madrid'),
                 React.createElement('p', null, 'Buscamos desarrollador con experiencia en React'),
                 React.createElement('button', { className: 'button-apply-job' }, 'Aplicar')
            )
            */
            /* Renderizar la tarjeta
            root.render(tarjetaEmpleo)
            */

        /*El ejemplo en html sería:
            <div class="container">  
                <h1>Título</h1>  
                <p>Párrafo</p>  
                <button>Botón</button>
            </div>
        */
        -->
        <!-- 2. ¡NOVEDAD! Cargar Babel para transformar JSX -->
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <!-- 3. Nuestro código React CON JSX -->
        <script type="text/babel">
            // Ahora podemos escribir JSX directamente
            const titulo = <h1 style={{ color: '#09f' }}>¡Hola React con JSX!</h1>

            //Renderizar
            window.onload = () => {
                const rootEl = document.querySelector('#root')
                const root = ReactDOMClient.createRoot(rootEl)
                root.render(titulo)
            }

            //Podemos crear un objeto con la información de un empleo y luego renderizarlo en una tarjeta
            //Combinamos JSX con variables de JavaScript usando llaves {}
            const empleo = {
                titulo: 'Desarrollador Frontend',
                empresa: 'TechCorp',
                ubicacion: 'Madrid',
                descripcion: 'Buscamos desarrollador con experiencia en React'
            }

            const tarjeta = (
                <article className="job-listing-card">
                    <div>
                        <h3>{empleo.titulo}</h3>
                        <small>{empleo.empresa} | {empleo.ubicacion}</small>
                        <p>{empleo.descripcion}</p>
                    </div>
                    <button className="button-apply-job">Aplicar</button>
                </article>
            )
        </script> 
        <script type="text/babel">
            const empleos = [
                {
                    titulo: 'Desarrollador Frontend',
                    empresa: 'TechCorp',
                    ubicacion: 'Madrid',
                    descripcion: 'Buscamos desarrollador con experiencia en React'
                },
                {
                    titulo: 'Diseñador UX/UI',
                    empresa: 'DesignStudio',
                    ubicacion: 'Barcelona',
                    descripcion: 'Se busca diseñador con experiencia en Figma y Adobe XD'
                },
                {
                    titulo: 'Ingeniero de Datos',
                    empresa: 'DataSolutions',
                    ubicacion: 'Valencia',
                    descripcion: 'Experiencia en Python y SQL requerida'
                }
            ]

            const app = (
                <div>
                    <h1>DevJobs - Ofertas de empleo</h1>
                    <p>Hay {empleos.length} ofertas disponibles</p>

                    <article className="job-listing-card">
                        <h3>{empleos[0].titulo}</h3>
                        <small>
                            {empleos[0].empresa} | {empleos[0].ubicacion}
                        </small>
                        <button className="button-apply-job">Aplicar</button>
                    </article>
                    </div>
            )

            window.onload = () => {
                const rootEl = document.querySelector('#root')
                const root = ReactDOMClient.createRoot(rootEl)
                root.render(app)
            }
        </script>
    </body>

</html>
