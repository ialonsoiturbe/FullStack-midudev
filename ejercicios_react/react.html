<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>React - JobCard</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>

    <body>
        <div id="root"></div>
        <script type="module">
            import React from 'https://esm.sh/react?dev'
            import ReactDOM from 'https://esm.sh/react-dom/client?dev'
            window.React = React
            window.ReactDOM = ReactDOM
        </script>

        <script src ="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <script type="text/babel">
            //Muestra la cabecera y navegación
            function Header() {
                return (
                    <header>
                        <h1>DevJobs</h1>
                        <nav>
                            <a href="/">Inicio</a>
                            <a href="/empleos">Empleos</a>
                        </nav>
                    </header>
                )
            }

            //Funcion de jobcards que se ejecuta al hacer click
            function JobCard({ titulo, empresa, ubicacion, descripcion }) {
                //Definimnios la función handleAplicar que se ejecuta al hacer click en el botón dentro del componente
                //Esta función tiene acceso a as props titulo y empresa, que se pasan como argumentos al componente JobCard
                //Conectamos la función al botón con onClick={handleAplicar}
                const handleAplicar = () => {
                    console.log('¡Click en el botón!')
                    console.log('Aplicando a:', titulo, '-', empresa)
                    alert(`Has aplicado a: ${titulo} en ${empresa}`)
                }
                return (
                    <article className="job-listing-card">
                        <div>
                            <h3>{titulo}</h3>
                            <small>{empresa} | {ubicacion}</small>
                            <p>{descripcion}</p>
                        </div>
                        <button className="button-apply-job" onClick={handleAplicar}>
                            Aplicar
                        </button>
                    </article>
                )
            }

            //Muestra la lista de empleos
            function JobList() {
                return (
                    <div className="jobs-listings">
                        <JobCard
                            titulo="Desarrollador Frontend"
                            empresa="TechCorp"
                            ubicacion="Madrid"
                            descripcion="Buscamos desarrollador con experiencia en React"
                        />
                        <JobCard
                            titulo="Diseñador UX/UI"
                            empresa="DesignStudio"
                            ubicacion="Barcelona"
                            descripcion="Se busca diseñador creativo con experiencia en diseño de interfaces"
                        />
                        <JobCard
                            titulo="Ingeniero de Datos"
                            empresa="DataSolutions"
                            ubicacion="Valencia"
                            descripcion="Se busca ingeniero de datos con experiencia en análisis y visualización de datos"
                        />
                    </div>
                )
            }

            //Muestra el pie de página
            function Footer() {
                return (
                    <footer>
                        <p>&copy; 2024 DevJobs. Todos los derechos reservados.</p>
                    </footer>
                )
            }

            //Compone todos los componentes anteriores
            function App() {
                return (
                    <div>
                        <Header />
                        <JobList />
                        <Footer />
                    </div>
                )
            }

            window.onload = () => {
                const rootEl = document.querySelector('#root')
                const root = ReactDOM.createRoot(rootEl)
                root.render(<App />)
            }
        </script>
    </body>
</html>
